backend:
  name: git-gateway
  branch: main

media_folder: "public/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "blog"
    label: "Artigos"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição SEO", name: "seo_description", widget: "text", required: false }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Autor", name: "author", widget: "string", default: "Victor Hugo" }
      - { label: "Categoria", name: "category", widget: "select", options: ["Apps e Dicas", "Inteligência Artificial", "Tecnologia Automotiva", "Notícias Tech"], default: "Notícias Tech" }
      - { label: "Imagem de Destaque", name: "image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: ["Tech", "Premium"] }
      - { label: "Corpo do Artigo", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Páginas Fixas"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição", name: "description", widget: "text", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
