backend:
  name: git-gateway
  branch: main

media_folder: "public/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "blog"
    label: "Artigos"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data de Publicação", name: "date", widget: "datetime" }
      - { label: "Thumbnail", name: "image", widget: "image" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", default: ["Tecnologia"] }
      - { label: "Meta Description", name: "seo_description", widget: "text" }
      - { label: "Corpo do Texto", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Páginas Fixas"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Corpo do Texto", name: "body", widget: "markdown" }
